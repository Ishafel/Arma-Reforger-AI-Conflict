		"10 · Setup and limitations"
		"%1<br/><br/>AI Conflict adds an autonomous war to Conflict: commanders capture and defend bases, move infantry and vehicles, bring supplies, replace losses and develop infrastructure. The battlefield stays active without players. You can fight with your squad or coordinate allied forces from the map.<br/><br/>First steps: choose your faction and a player group, deploy at an available allied base, check supplies and the radio network, then choose a nearby objective. Keep your rear supplied and protect captured bases. In Co-op, recruit your own soldiers and place the buildings you need.<br/><br/>This journal is available from the briefing tool on the map. The following pages explain the rules and controls. The map shows the current situation; this is a reference, not a live status report."
		"CONFLICT<br/>Players can join either main side. By default, both sides have an AI commander; a server may assign only one side to AI. Autonomous squads attack, defend and replenish while you participate in the campaign.<br/><br/>VICTORY<br/>A side wins when its opponent runs out of reinforcement tickets, or when it owns every active capture objective and none is being captured or contested. Headquarters and radio relay nodes do not count toward territorial victory. Enemy presence alone does not block victory unless an objective is actually contested.<br/><br/>Losing a managed squad and replacing it normally costs one ticket plus supplies; reinforcing its survivors costs supplies only. Capture bases, interrupt enemy logistics and preserve your army. These AI Conflict rules replace the stock strategic-location hold timer; radio coverage still matters for normal base operations."
		"CO-OP<br/>Players fight together on the side selected before launch. Only that side is available to players. The enemy keeps its autonomous army, reinforcements and construction. Your side has no autonomous combat roster, automatic combat replacements or automatic placement of buildings. Builders, requested supply deliveries and barracks orders remain available.<br/><br/>VICTORY AND DEFEAT<br/>Win by exhausting the enemy reinforcement tickets, or by owning every active capture objective with no capture or contest in progress. Headquarters and radio relays are excluded from territorial victory. Your side loses by territory, not by tickets. Losing all members of one player squad does not itself end the campaign.<br/><br/>Organize player groups, recruit purchased soldiers and build your support network. The enemy will keep advancing without waiting for players. These AI Conflict conditions replace the stock strategic-location hold timer."
		"Open the map and the AI Conflict command interface. Select an allied managed squad to inspect its status and available orders. Set a movement, attack or defence objective using the map controls. You can send surviving infantry to reinforce at a barracks, give it priority in the reinforcement queue, or return a squad to AI control.<br/><br/>Manual orders remain in force until completed or changed; the autonomous commander does not simply overwrite them. Returned squads resume the commander's campaign plan. The commander distributes attacks and defence according to objectives, threats, routes and available forces.<br/><br/>Player groups and nearby recruited soldiers also use the native group menu and command wheel. Leadership, ownership and AI limits still apply. In Co-op there is no friendly autonomous combat roster to select; command your recruited soldiers through the native controls."
		"At an allied barracks, order soldiers or a squad from the troop list and wait for them to appear. Purchased squads can be recruited in both Conflict and Co-op, including purchased Guard squads. Paying for a squad does not automatically add every soldier to your player group.<br/><br/>To recruit, join or create a player group, become its leader, approach a purchased allied soldier and use Recruit in the native command wheel. There must be room within the native AI limit (normally four AI per player group). A full purchased squad may exceed that limit; recruit only as many soldiers as your group allows.<br/><br/>If Recruit is unavailable, check leadership in the group menu, the AI count, faction and whether this soldier belongs to a purchased squad. Ordinary base guards, construction workers and autonomous AI Conflict squads are not made recruitable by this feature. Orders still cost supplies."
		"Use the AI Conflict equipment editor to prepare a personal spawn preset or a squad equipment template. Check both weapon slots, ammunition, clothing and the contents of containers and pouches before saving. Equipment is drawn from the active content profile.<br/><br/>A personal preset is applied through respawn. Squad templates equip new soldiers; existing soldiers receive changes at a safe allied arsenal. A saved template does not instantly replace equipment in the middle of combat. Inventory capacity and access rules still apply.<br/><br/>After combat, managed soldiers can replenish ammunition and suitable consumables and collect compatible supplies from nearby bodies. Available items must fit their equipment and template. Following your death, the deployment interface also allows you to take control of a living AI member of your own group with that soldier's current equipment. The normal respawn delay is preserved."
		"Supplies support construction, vehicle and troop orders, and reinforcement. Check stocks at the base where an action will be performed; a large faction total does not mean every base has supplies. Capture and connect bases through the radio network.<br/><br/>Use the supply interface on the map to choose allied source and destination bases and the amount to deliver. An accepted request sends a real supply vehicle along a route. Supplies do not teleport to the destination when you press the button. Follow the shipment status and protect the truck; unsafe roads, losses and lack of available transport can delay delivery.<br/><br/>Autonomous forces use transport and combat vehicles when suitable assets and routes are available. Logistics and the supply economy remain part of every mode, including Co-op. A supply request does not grant ownership of the delivery vehicle or crew."
		"Managed infantry replenishes at a safe allied barracks with enough supplies. Surviving squads move there to receive replacements. Replacing a fully destroyed managed squad normally costs one ticket plus supplies; filling missing members costs supplies without a ticket.<br/><br/>Each faction has one sequential reinforcement queue. One squad is completed before the next is served. Recruitment proceeds one soldier every five seconds; a full ten-person squad takes about 45 seconds of scheduled recruitment, plus travel, queueing and actual spawning. A request does not create an entire squad immediately.<br/><br/>Map status and priority controls help you monitor this queue. Captured or unsafe barracks, unavailable resources and spawn restrictions can postpone service. Co-op players do not receive automatic combat replacements: purchase and recruit soldiers at the barracks. Enemy AI reinforcement remains active."
		"Develop allied bases with barracks, arsenals, vehicle facilities and other available support structures. These facilities enable recruitment, rearming, repairs and vehicle orders. Rank restrictions on construction and vehicle requests are removed; supply costs and placement rules remain.<br/><br/>On sides controlled by the autonomous commander, AI plans infrastructure and construction workers finish layouts. Work can resume after initial combat losses; building is not limited to the opening of the match.<br/><br/>On the human side in Co-op, automatic placement is disabled. Place the structures you need yourself and provide supplies. Construction workers can still be created to finish your layouts. Protect workers and the construction site. Purchased workers are not combat recruits, and their presence does not automatically place new buildings."
		"Neutral FIA bases resist both main sides. Garrisons activate near players and advancing managed AI groups, so AI can fight them without a player standing nearby. Additional garrisons and road patrols become dormant when observers leave; recorded losses are retained. Vehicle crews defend their area rather than pursuing enemies across the island.<br/><br/>EASY: infantry, without additional garrison vehicles or road patrols.<br/>MEDIUM: one APC per eligible garrison, with a random dismount group of up to two or four soldiers.<br/>HARD: a random pair of tanks/APCs; one eligible strongpoint can have three or four vehicles. If the content has no suitable FIA tanks, APCs substitute for them. Seat availability limits dismounts.<br/><br/>Difficulty changes the garrison composition, not rifle accuracy. Medium and Hard also increase anti-tank roles in standard autonomous squads. Vanilla keeps stock FIA weapons; RHS/WCS use their own equipment mix. Beware of armour and protect your supply routes."
		"Choose the map, enabled content, Conflict or Co-op, player side, garrison difficulty, starting time and weather before launching. The time slider covers 00:00–23:59; weather may be random or a selected preset. Time and weather continue to change during play. The active scenario title on the first page identifies the selected map, mode and difficulty.<br/><br/>Only enabled content with its dependencies is available in setup; downloading a mod alone does not enable it. Vanilla uses US Army/Soviet Army, RHS uses USMC/Russian MSV, and WCS + RHS uses NATO/Russia. Available weapons and vehicles depend on that profile. The operation loads the selected addon set. See Setup guide in the selection menu for preparation steps.<br/><br/>The northern map variant limits active objectives while keeping the landscape accessible. Every launch starts a new campaign; saving and resuming a match is not supported yet. This journal describes default rules: server configuration and native limits can affect availability and timing."
