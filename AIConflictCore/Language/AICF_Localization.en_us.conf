		"Both sides"
		"Start loads exactly this addon set. Other enabled addons are excluded from the operation."
		"Unavailable: install all dependencies for"
		"Select the area of operations. North Everon limits objectives to the northern part of the island. Changing map keeps your content choice when available; otherwise the first available set is selected."
