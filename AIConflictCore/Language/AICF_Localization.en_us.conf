		"All players fight for the selected side against the AI. Your side has no autonomous combat squads or automatic construction. Builders and barracks orders remain available. Select a flag to change player side."
		"Easy: FIA infantry garrisons, without vehicles or road patrols. Difficulty affects defenders, not your shooting accuracy."
		"Medium: one APC per garrison with crew and up to 2 or 4 dismounts. No tanks or reinforced objective. FIA road patrols are enabled."
